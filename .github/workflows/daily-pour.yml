name: Today's Pour

on:
  schedule:
    # The script uses Eastern time. These runs cover both daylight and standard time.
    - cron: '43 12,13,14,15 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Preview, publish today's card, or verify delivery
        required: true
        default: preview
        type: choice
        options:
          - preview
          - publish
          - verify

concurrency:
  group: todays-pour
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser for the website card export
        run: npx playwright install --with-deps chromium
      - name: Check date, account, and duplicate protection
        run: npm test
      - name: Prepare or publish today's card
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_MODE: ${{ inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            node scripts/daily-pour.mjs --scheduled
          elif [ "$REQUESTED_MODE" = "publish" ]; then
            node scripts/daily-pour.mjs --publish
          elif [ "$REQUESTED_MODE" = "verify" ]; then
            node scripts/verify-posts.mjs
          else
            node scripts/daily-pour.mjs --preview
          fi
      - name: Save card and run report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: todays-pour-${{ github.run_id }}
          path: output/
          if-no-files-found: ignore
          retention-days: 14
