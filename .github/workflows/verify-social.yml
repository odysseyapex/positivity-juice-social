name: Verify daily social posts

on:
  schedule:
    - cron: '17 0,1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: vars.PUBLISH_ENABLED == 'true' && vars.PUBLISH_REELS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify both card publications
        id: cards
        continue-on-error: true
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-posts.mjs
      - name: Verify both Reel publications
        id: reels
        continue-on-error: true
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-reels.mjs
      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: social-verification-${{ github.run_id }}
          path: output/*verification.json
          retention-days: 14
      - name: Flag any unconfirmed publication
        if: steps.cards.outcome == 'failure' || steps.reels.outcome == 'failure'
        run: exit 1
