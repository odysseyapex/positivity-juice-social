name: Daily B roll Reel

on:
  schedule:
    - cron: '12 13,14,15 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Preview or queue today's B roll Reel
        required: true
        default: preview
        type: choice
        options:
          - preview
          - publish

concurrency:
  group: todays-pour
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
      PUBLISH_REELS_ENABLED: ${{ vars.PUBLISH_REELS_ENABLED }}
      PYTHON_BINARY: python3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install renderer dependencies
        run: |
          npm ci
          python3 -m pip install Pillow==11.3.0
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Check dates, rotation and duplicate protection
        run: npm test
      - name: Render or schedule today's Reel
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_MODE: ${{ inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            node scripts/daily-reel.mjs --scheduled
          elif [ "$REQUESTED_MODE" = "publish" ]; then
            node scripts/daily-reel.mjs --publish
          else
            node scripts/daily-reel.mjs --preview
          fi
      - name: Save finished Reel and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daily-reel-${{ github.run_id }}
          path: output/reels/
          if-no-files-found: ignore
          retention-days: 14
